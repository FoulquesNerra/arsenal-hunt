/* ---- numbers for one weapon + barrel + ammo ---- */
function baseOf(w,b){
 var o={d:w.d,r:w.r,m:w.m,f:w.f,c:w.c,v:w.v,sp:w.sp,sw:w.sw,rl:w.rl,ex:w.ex,ld:w.ld,sl:w.sl||1};
 if(b===2&&w.b2){["r","m","f","c","v","rl","ex","ld"].forEach(function(k){if(w.b2[k]!==undefined)o[k]=w.b2[k]});o.sl=1}
 return o;
}
function selOf(w){return state.sel[w.n]||{b:1,a:-1}}
function calc(w,sel){
 var B=baseOf(w,sel.b),cur={},old={},am=sel.a>=0?w.am[sel.a]:null,k,c;
 for(k in B){cur[k]=B[k];old[k]=B[k]}
 if(am)for(c in am.dl){
  if(c==="L"){old.ld=String(am.dl[c][0]);cur.ld=String(am.dl[c][1]);continue}
  k=CODE[c];old[k]=am.dl[c][0];cur[k]=am.dl[c][1];
 }
 return{B:B,cur:cur,old:old,am:am};
}
function shown(r,k,which){var x=r[which][k];return k==="ex"&&x!=null?x*r.B.sl:x}
var MAX={},MAXM=0;
W.forEach(function(w){
 if(w.mh>MAXM)MAXM=w.mh;if(w.ml>MAXM)MAXM=w.ml;
 if(w.a==="H")return;
 [1,2].forEach(function(b){
  if(b===2&&!w.b2)return;
  var sels=[{b:b,a:-1}];w.am.forEach(function(a,i){if((a.b||1)===b)sels.push({b:b,a:i})});
  sels.forEach(function(s){var r=calc(w,s);PERF.forEach(function(k){["cur","old"].forEach(function(q){var x=shown(r,k,q);if(x!=null&&(MAX[k]===undefined||x>MAX[k]))MAX[k]=x})})});
 });
});

/* ---- filters and sorting ---- */
function sortGet(w,k){
 if(k==="ex")return w.ex==null?null:w.ex*(w.sl||1);
 if(k==="ld")return ldNum(w.ld);
 if(k==="a")return CLS.indexOf(w.a);
 var x=w[k];return x===undefined?null:x;
}
function defDir(k){return k==="n"||k==="p"||k==="s"||k==="a"||HI[k]===-1?1:-1}
function on(o){return Object.keys(o).filter(function(k){return o[k]})}
var FAV={};try{FAV=JSON.parse(localStorage.getItem("arsenal-favs")||"{}")||{}}catch(e){FAV={}}
function favSave(){try{localStorage.setItem("arsenal-favs",JSON.stringify(FAV))}catch(e){}}
function favBtn(n){var on=!!FAV[n];return'<button type="button" class="fav" data-act="fav" data-n="'+h(n)+'" aria-pressed="'+on+'" aria-label="'+h(t(on?"favRem":"favAdd")+" : "+n)+'" title="'+h(t(on?"favRem":"favAdd"))+'">'+(on?"★":"☆")+"</button>"}
function pass(w){
 if(state.fav&&!FAV[w.n])return false;
 var sz=on(state.sizes),cl=on(state.classes);
 if(sz.length&&sz.indexOf(String(w.s))<0)return false;
 if(cl.length&&cl.indexOf(w.a)<0&&!(w.a2&&cl.indexOf(w.a2)>=0))return false;
 if(state.special&&!w.am.some(function(a){return a.k===state.special}))return false;
 if(w.p>state.pmax)return false;
 if(state.novar&&w.var)return false;
 if(state.q){var n=norm(w.n);if(!norm(state.q).split(" ").every(function(p){return n.indexOf(p)>=0}))return false}
 return true;
}
function cmpW(a,b){
 var x=sortGet(a,state.sort),y=sortGet(b,state.sort),nm=a.n.localeCompare(b.n,undefined,{numeric:true});
 if(x===null&&y===null)return nm;if(x===null)return 1;if(y===null)return-1;
 var r=typeof x==="string"?x.localeCompare(y,undefined,{numeric:true}):x-y;
 return r*state.dir||nm;
}

/* ---- pairings (computed) ---- */
function role(w){if(w.a==="H"||w.a==="B")return"close";if(w.r!=null&&w.r<=45)return"close";if(w.r>=115)return"long";return"mid"}
var PREF={long:{close:0,mid:18,long:80},close:{long:0,mid:25,close:80},mid:{long:0,close:10,mid:60}};
function pairs(w,room,exact){
 var rw=role(w),out=[];
 W.forEach(function(c){
  if(c.sc||c.fam===w.fam)return;if(exact?c.s!==room:c.s>room)return;
  out.push({w:c,sc:PREF[rw][role(c)]+(room-c.s)*12+(c.a===w.a?15:0)+(c.a==="H"?22:0)+(c.a==="X"?8:0)+(c.var?6:0)+Math.abs(Math.log(c.p/w.p))*6});
 });
 out.sort(function(a,b){return a.sc-b.sc||a.w.n.localeCompare(b.w.n)});
 var seen={},res=[],melee=0;
 for(var i=0;i<out.length&&res.length<3;i++){var c=out[i].w;if(seen[c.fam])continue;if(c.a==="H"){if(melee)continue;melee++}seen[c.fam]=1;res.push(c)}
 return res;
}

  '<span class="gl">'+h(t("kitSize"))+"</span>"+kOpts("s"+i,[0,1,2,3,4,5],k["s"+i],function(v){return v?String(v):t("kitAll")},function(v){return v&&(v>cap-1||(o&&v+o>cap))})+

function kitRes(){
 var C=kcombos(),k=state.kit,s="<h3>"+h(t("kitRes"))+"</h3>";

function copyTw(btn){
 function done(ok){btn.textContent=ok?t("copied"):t("copySel");clearTimeout(btn._t);btn._t=setTimeout(function(){btn.textContent=t("copy")},2400)}
 function pick(){try{var el=$("tw-h"),r=document.createRange(),s=window.getSelection();r.selectNodeContents(el);s.removeAllRanges();s.addRange(r)}catch(e){}}

/* ---- chrome ---- */
function chips(id,keys,set,label){

function tabsHTML(){

  var c=v==="cmp"?state.cmp.length:v==="book"&&gbLive()?GB.list.length:0;
  return'<button type="button" data-v="'+v+'"'+(state.view===v?' aria-current="page"':"")+">"+h(t("tabs")[v])+(c?'<span class="bdg">'+c+"</span>":"")+"</button>"}).join("");

function priceOut(){$("o-pr").textContent=state.pmax>=PMAX?t("noLimit"):"≤ "+money(state.pmax)}
function dirOut(){$("b-dir").textContent=state.dir>0?t("asc"):t("desc")}
function chrome(){
 document.documentElement.lang=HL[state.lang]||state.lang;lookSync();$("l-contact").textContent=t("contactLink");$("lang-sel").value=state.lang;
 
 $("t-title").textContent=t("title");$("t-sub").textContent=t("sub").replace("{n}",W.length);

 chips("c-size",[1,2,3,4,5],state.sizes,function(k){return k});
 chips("c-class",CLS,state.classes,function(k){return t("cls")[k]});
 var have={};W.forEach(function(w){w.am.forEach(function(a){have[a.k]=1})});
 $("fsp").innerHTML='<option value="">'+h(t("any"))+"</option>"+AMORDER.filter(function(k){return have[k]}).map(function(k){return'<option value="'+h(k)+'"'+(state.special===k?" selected":"")+">"+h(aname(k))+"</option>"}).join("");
 $("fsort").innerHTML=SORTKEYS.map(function(k){return'<option value="'+k+'"'+(state.sort===k?" selected":"")+">"+h(sl1(k))+"</option>"}).join("");
 if(SORTKEYS.indexOf(state.sort)<0)$("fsort").insertAdjacentHTML("beforeend",'<option value="'+state.sort+'" selected>'+h(sl1(state.sort))+"</option>");
 priceOut();dirOut();tabsHTML();
 var f=t("src").replace("{wiki}",'<a href="https://huntshowdown.wiki.gg/wiki/Weapons" target="_blank" rel="noopener">Hunt: Showdown 1896 Wiki</a>').replace("{bayou}",'<a href="https://bayouindex.com/weapons/" target="_blank" rel="noopener">The Bayou Index</a>');
 $("foot").innerHTML=contactHTML(f)+"<details><summary>"+h(t("gloss"))+"</summary><dl>"+t("g").map(function(g){return"<div><dt>"+h(g[0])+t("colon")+"</dt><dd>"+h(g[1])+"</dd></div>"}).join("")+"</dl></details><p>"+h(t("excl"))+"</p>";
}
function view(){
 var v=$("view");$("filters").hidden=state.view==="cmp"||state.view==="book"||state.view==="kit";
 if(state.view==="cmp"){v.innerHTML=cmpHTML();return}
 if(state.view==="book"){v.innerHTML=bookHTML();gbForm();return}
 if(state.view==="kit"){v.innerHTML=kitHTML();return}
 var L=W.filter(pass).sort(cmpW);
 $("cnt").textContent=t("count")(L.length,W.length);
 v.innerHTML=state.view==="table"?tableHTML(L):listHTML(L);

function itemEl(n){var a=document.querySelectorAll("li.item");for(var i=0;i<a.length;i++)if(a[i].getAttribute("data-n")===n)return a[i];return null}
function refreshCard(n){var p=document.querySelector(".pane"),el=p&&p.getAttribute("data-n")===n?p:itemEl(n),c=el&&el.querySelector(".card");if(c)c.outerHTML=cardHTML(BY[n])}
function setSort(k,toggle){
 if(state.sort===k&&toggle)state.dir=-state.dir;else{state.sort=k;state.dir=defDir(k)}
 chrome();view();
}
function resetFilters(){
 state.fav=false;$("ffav").checked=false;state.q="";state.sizes={};state.classes={};state.special="";state.novar=false;state.pmax=PMAX;
 $("q").value="";$("fpr").value=PMAX;$("fvar").checked=false;

/* ---- events ---- */
$("view").addEventListener("click",function(e){
 var el=e.target.closest("[data-act]");if(!el)return;
 var act=el.getAttribute("data-act"),it=el.closest("li.item,.pane"),n=it?it.getAttribute("data-n"):null;
 if(act==="toggle"){
  if(wide()){state.open=n;view();var r=itemEl(n),pn=document.querySelector(".pane");if(r)r.querySelector(".row").focus({preventScroll:true});if(pn)pn.scrollTop=0;return}
  state.open=state.open===n?null:n;view();var x=state.open&&itemEl(n);if(x)x.scrollIntoView({block:"nearest"})}
 else if(act==="ammo"){state.sel[n]={b:+el.getAttribute("data-b"),a:+el.getAttribute("data-a")};refreshCard(n)}
 else if(act==="cmp"){var w=BY[n],s=selOf(w);toggleCmp(w.a==="H"?n+"|1|-1":n+"|"+s.b+"|"+s.a);tabsHTML();refreshCard(n)}
 else if(act==="fav"){var fn=el.getAttribute("data-n");if(FAV[fn])delete FAV[fn];else FAV[fn]=1;favSave();if(state.fav){view();return}Array.prototype.forEach.call(document.querySelectorAll('.fav[data-n]'),function(b){if(b.getAttribute("data-n")===fn)b.outerHTML=favBtn(fn)})}
 else if(act==="go")goTo(el.getAttribute("data-n"));
 else if(act==="sort")setSort(el.getAttribute("data-k"),true);
 else if(act==="rm"){state.cmp.splice(+el.getAttribute("data-i"),1);state.iso=null;state.read="";tabsHTML();view()}
 else if(act==="iso"){var c=+el.getAttribute("data-c");state.iso=state.iso===c?null:c;state.read="";view()}
 else if(act==="clear"){state.cmp=[];state.iso=null;state.read="";tabsHTML();view()}
 else if(act==="pt"){state.read=el.getAttribute("data-t");$("rd").textContent=state.read}
 else if(act==="view")setView(el.getAttribute("data-v"));
 else if(act==="gbdel")gbDelete(el.getAttribute("data-d"),el.getAttribute("data-i"));
 else if(act==="kitset"){var kf=el.getAttribute("data-f"),kv=el.getAttribute("data-v");state.kit[kf]=kf==="s1"||kf==="s2"?+kv:kv;state.kit.n=30;kfix();view()}
 else if(act==="kitmore"){state.kit.n+=30;$("kitres").innerHTML=kitRes()}
 else if(act==="kitreset"){state.kit=kitNew();view()}
 else if(act==="kitunlock"){state.kit["l"+el.getAttribute("data-i")]="";state.kit["u"+el.getAttribute("data-i")]=[];state.kit.n=30;view()}
 else if(act==="kitlock"){state.kit=kitNew();state.kit.l1=n;state.kit.qm=BY[n].s>=5;setView("kit")}
 else if(act==="kitcmp"){state.cmp=[];state.iso=null;state.read="";toggleCmp(kkey2(1,el.getAttribute("data-a")));toggleCmp(kkey2(2,el.getAttribute("data-b")));setView("cmp")}
});

 else if(id==="gb-sig")GB.sig=e.target.value;

 else if(id==="kit-l1"||id==="kit-l2"){state.kit["u"+id.slice(5)]=[];state.kit["l"+id.slice(5)]=e.target.value;state.kit.n=30;kfix();view()}
 else if(id==="kit-qm"||id==="kit-var"||id==="kit-mel"){state.kit[{"kit-qm":"qm","kit-var":"vars","kit-mel":"mel"}[id]]=e.target.checked;state.kit.n=30;kfix();view()}
});

try{if(localStorage.getItem("arsenal-look")==="dark")document.documentElement.setAttribute("data-look","dark")}catch(e){}
var hv=fromHash();if(hv&&(hv!=="book"||RT))state.view=hv;
chrome();view();gbStart();
})();
